<section class="favorite-track">

  <h2>my fav track</h2>

  <!-- ГЛАВНЫЙ ПЛЕЕР -->
  <div class="track-card">

    <div class="track-cover">
      <img
        id="currentCover"
        src="opiaty.jpg"
        alt="Опиаты"
      >
    </div>

    <div class="track-info">

      <h3 id="currentTitle">Опиаты</h3>

      <p id="currentArtist">Платина</p>

      <div class="custom-player">

        <button
          id="playTrack"
          class="play-track"
          type="button"
        >
          ▶
        </button>

        <span id="trackTime">0:00</span>

        <input
          id="trackProgress"
          class="track-progress"
          type="range"
          min="0"
          max="100"
          value="0"
        >

        <span id="trackDuration">0:00</span>

        <div class="volume-control">

          <div class="volume-popup">

            <input
              id="volumeProgress"
              class="volume-progress"
              type="range"
              min="1"
              max="100"
              value="100"
              title="Громкость"
            >

            <span id="volumeValue">100</span>

          </div>

          <button
            id="volumeTrack"
            class="volume-track"
            type="button"
            aria-label="Громкость"
          >
            <svg
              viewBox="0 0 24 24"
              width="21"
              height="21"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
              <path d="M19 5a10 10 0 0 1 0 14"></path>
            </svg>
          </button>

        </div>

      </div>

      <audio id="favoriteTrack">
        <source src="opiaty.mp3" type="audio/mpeg">
      </audio>

    </div>

  </div>
