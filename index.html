<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>c4inkl info</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ⚙️ ШЕСТЕРЁНКА -->
  <button
    class="settings-button"
    id="settingsButton"
    aria-label="Открыть настройки"
    type="button"
  >
    ⚙️
  </button>


  <!-- ⚙️ ОКНО НАСТРОЕК -->
  <div class="settings-panel" id="settingsPanel">

    <h3>⚙️ Настройки</h3>

    <p>Тема</p>

    <div class="settings-row">

      <button
        class="theme-choice active"
        data-mode="light"
        type="button"
      >
        ☀️ Светлая
      </button>

      <button
        class="theme-choice"
        data-mode="dark"
        type="button"
      >
        🌙 Тёмная
      </button>

    </div>


    <p>Цвет</p>

    <div class="color-choices">

      <button
        class="color-choice active"
        data-color="pink"
        title="Розовый"
        type="button"
      ></button>

      <button
        class="color-choice purple"
        data-color="purple"
        title="Фиолетовый"
        type="button"
      ></button>

      <button
        class="color-choice green"
        data-color="green"
        title="Зелёный"
        type="button"
      ></button>

      <button
        class="color-choice gray"
        data-color="gray"
        title="Серый"
        type="button"
      ></button>

    </div>
    <p>Шрифт</p>

<div class="font-choices">

  <button
    class="font-choice active"
    data-font="Arial"
    type="button"
  >
    Arial
  </button>

  <button
    class="font-choice"
    data-font="Verdana"
    type="button"
  >
    Verdana
  </button>

  <button
    class="font-choice"
    data-font="Georgia"
    type="button"
  >
    Georgia
  </button>

  <button
    class="font-choice"
    data-font="Comic Sans MS"
    type="button"
  >
    Comic
  </button>

</div>

  </div>

<section class="favorite-track">

  <h2 class="my-fav-track-title">my fav track</h2>

  <div class="track-card">

    <div class="track-cover">
  <img src="opiaty.jpg" alt="Опиаты Круг — Платина">
</div>

    <div class="track-info">

      <h3>Опиаты</h3>

      <p>Платина</p>

      <div class="custom-player">

  <button id="playTrack" class="play-track" type="button">
    ▶
  </button>

  <span id="trackTime">0:00</span>

  <input
    id="trackProgress"
    class="track-progress"
    type="range"
    min="0"
    max="100"
    value="0"
  >

  <span id="trackDuration">0:00</span>

  <div class="volume-control">

    <div class="volume-popup">
        <input
            id="volumeProgress"
            class="volume-progress"
            type="range"
            min="1"
            max="100"
            value="100"
            title="Громкость"
        >
        
    </div>

    <button
        id="volumeTrack"
        class="volume-track"
        type="button"
        aria-label="Громкость"
    >
        <svg
            viewBox="0 0 24 24"
            width="21"
            height="21"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
        >
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
            <path d="M19 5a10 10 0 0 1 0 14"></path>
        </svg>
    </button>

</div>

</div>

<audio id="favoriteTrack">
  <source src="opiaty.mp3" type="audio/mpeg">
</audio>
    </div>

  </div>

</section>
  <!-- ОСНОВНОЙ САЙТ -->
  <main class="card">

    <img
      class="photo"
      src="photo.jpg"
      alt="Фотография"
    >


    <h1>HI, im c4inkl!</h1>

    <p class="subtitle">
      Intermediate programmer & web enthusiast
    </p>


    <h2>about me</h2>

    <p>
      love cs2, anime, diana<3
    </p>


    <h2>My interests</h2>

    <ul>
      <li>💻 coding</li>
      <li>🎮 game</li>
      <li>🎵 music</li>
    </ul>


    <h2>my social</h2>

    <div class="links">

      <a
        href="https://t.me/plohoypareennn"
        target="_blank"
      >
        Telegram
      </a>

      <a
        href="https://youtube.com/ТВОЙ_НИК"
        target="_blank"
      >
        YouTube
      </a>

      <a
        href="https://instagram.com/c4inkl"
        target="_blank"
      >
        Instagram
      </a>

    </div>


    <h2>anonymous message</h2>

    <form id="messageForm">

      <textarea
        id="anonymousMessage"
        placeholder="text..."
        maxlength="1000"
        required
      ></textarea>

      <button type="submit">
         send anonymously
      </button>

      <p id="formStatus"></p>

    </form>


    <button
      id="factButton"
      type="button"
    >
       about me
    </button>

    <p id="factText"></p>

  </main>


  <!-- JAVASCRIPT -->
  <script src="script.js"></script>

</body>
</html>
