<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>c4inkl info</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ⚙️ ШЕСТЕРЁНКА -->
  <button
    class="settings-button"
    id="settingsButton"
    aria-label="Открыть настройки"
    type="button"
  >
    ⚙️
  </button>


  <!-- ⚙️ ОКНО НАСТРОЕК -->
  <div class="settings-panel" id="settingsPanel">

    <h3>⚙️ Настройки</h3>

    <p>Тема</p>

    <div class="settings-row">

      <button
        class="theme-choice active"
        data-mode="light"
        type="button"
      >
        ☀️ Светлая
      </button>

      <button
        class="theme-choice"
        data-mode="dark"
        type="button"
      >
        🌙 Тёмная
      </button>

    </div>


    <p>Цвет</p>

    <div class="color-choices">

      <button
        class="color-choice active"
        data-color="pink"
        title="Розовый"
        type="button"
      ></button>

      <button
        class="color-choice purple"
        data-color="purple"
        title="Фиолетовый"
        type="button"
      ></button>

      <button
        class="color-choice green"
        data-color="green"
        title="Зелёный"
        type="button"
      ></button>

      <button
        class="color-choice gray"
        data-color="gray"
        title="Серый"
        type="button"
      ></button>

    </div>
    <p>Шрифт</p>

<div class="font-choices">

  <button
    class="font-choice active"
    data-font="Arial"
    type="button"
  >
    Arial
  </button>

  <button
    class="font-choice"
    data-font="Verdana"
    type="button"
  >
    Verdana
  </button>

  <button
    class="font-choice"
    data-font="Georgia"
    type="button"
  >
    Georgia
  </button>

  <button
    class="font-choice"
    data-font="Comic Sans MS"
    type="button"
  >
    Comic
  </button>

</div>

  </div>

<section class="favorite-track">

  <h2>      my fav track</h2>

  <div class="track-card">

    <div class="track-cover">
  <img src="opiaty.jpg" alt="Опиаты Круг — Платина">
</div>

    <div class="track-info">

      <h3>Опиаты</h3>

      <p>Платина</p>

      <div class="custom-player">

  <button id="playTrack" class="play-track" type="button">
    ▶
  </button>

  <span id="trackTime">0:00</span>

  <input
    id="trackProgress"
    class="track-progress"
    type="range"
    min="0"
    max="100"
    value="0"
  >

  <span id="trackDuration">0:00</span>

  <button id="volumeTrack" class="volume-track" type="button">
    🔈
</button>

<input
    id="volumeProgress"
    class="volume-progress"
    type="range"
    min="1"
    max="100"
    value="100"
    title="Громкость"
>

</div>

<audio id="favoriteTrack">
  <source src="opiaty.mp3" type="audio/mpeg">
</audio>
    </div>

  </div>

</section>
